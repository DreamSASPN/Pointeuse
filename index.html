<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTRANET & POINTEUSE — SASP NORD / BCSO</title>
    <style>
        :root {
            --bg-dark: #0d0f12;
            --card-bg: #161920;
            --card-header: #1e222d;
            --accent-gold: #d4af37;
            --accent-blue: #3b82f6;
            --text-primary: #f0f2f5;
            --text-secondary: #9da5b4;
            --border: #282e3d;
            --green: #10b981;
            --orange: #f59e0b;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER OFFICIEL AVEC IMAGE EN HAUT À GAUCHE */
        header {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-left img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
        }

        .header-title h1 {
            font-size: 22px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .badge-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-off { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
        .status-on { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
        .status-pause { background: rgba(245, 158, 11, 0.2); color: var(--orange); border: 1px solid var(--orange); }

        /* NAVIGATION ONGLETS */
        .nav-tabs {
            width: 100%;
            max-width: 1100px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-blue);
        }

        .tab-btn.em-tab.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        /* CONTENU */
        .tab-content {
            width: 100%;
            max-width: 1100px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
